    <style>
      .title { font-family:'P052','Palatino Linotype',serif; font-size:54px; font-weight:700; letter-spacing:1px; fill:#25231f; }
      .generic-title { font-size:50px; letter-spacing:1.6px; }
      .smallcaps { font-family:'Nimbus Sans',Arial,sans-serif; font-size:27px; font-weight:700; letter-spacing:1.3px; fill:#34342c; }
      .ledger { font-family:'Z003','P052',serif; font-size:39px; fill:#2e302a; font-variant-ligatures:none; font-feature-settings:'liga' 0, 'clig' 0; }
      .ledger-name { font-family:'Z003','P052',serif; font-size:39px; fill:#302e29; font-variant-ligatures:none; font-feature-settings:'liga' 0, 'clig' 0; }
      .letter { font-family:'Z003','P052',serif; font-size:45px; fill:#2d2a26; font-variant-ligatures:none; font-feature-settings:'liga' 0, 'clig' 0; }
      .letter-small { font-family:'Z003','P052',serif; font-size:42px; fill:#2d2a26; font-variant-ligatures:none; font-feature-settings:'liga' 0, 'clig' 0; }
      .editorial { font-family:'Nimbus Roman No9 L','Times New Roman',serif; font-size:29px; font-style:italic; fill:#4a463e; }
      .pencil { font-family:'Z003','P052',serif; font-size:43px; fill:#595852; font-variant-ligatures:none; font-feature-settings:'liga' 0, 'clig' 0; }
      .seal-id { font-family:'P052','Palatino Linotype',serif; font-size:112px; font-weight:700; fill:#34342d; }
      .seal-note { font-family:'Nimbus Sans',Arial,sans-serif; font-size:27px; font-weight:700; letter-spacing:2px; fill:#4b4a42; }
    </style>
  </defs>
  <rect width="1700" height="2200" fill="#f4ebdc"/>
  <rect width="1700" height="2200" fill="url(#paper)"/>
  <rect x="140" y="91" width="12" height="12" fill="#6e2f29"/>
  <text class="title generic-title" x="140" y="188">PLAYER MATERIAL H4</text>
  <path d="M140 226H1560" stroke="#34352d" stroke-width="3"/>
  
