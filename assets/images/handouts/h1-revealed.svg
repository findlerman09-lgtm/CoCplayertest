<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 1700 2200">
  <defs>
    <pattern id="paper" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#f4ebdc"/>
      <circle cx="11" cy="17" r="1.2" fill="#8a806d" opacity=".12"/>
      <circle cx="52" cy="39" r=".9" fill="#8a806d" opacity=".09"/>
      <path d="M5 60L18 58M43 10L59 12" stroke="#8a806d" stroke-width="1" opacity=".06"/>
    </pattern>
    <style><![CDATA[
      text { font-variant-ligatures:none; font-feature-settings:'liga' 0; }
      .paper { fill:url(#paper); }
      .ink { fill:#25231f; }
      .rule { stroke:#34352d; stroke-width:3; fill:none; }
      .heavy-rule { stroke:#34352d; stroke-width:7; fill:none; }
      .title { font-family:'P052','Palatino Linotype',serif; font-size:58px; font-weight:700; letter-spacing:1.2px; fill:#25231f; }
      .head { font-family:'Nimbus Sans',Arial,sans-serif; font-size:30px; font-weight:700; letter-spacing:1.6px; fill:#f4ebdc; }
      .body { font-family:'Nimbus Roman No9 L','Times New Roman',serif; font-size:32px; fill:#25231f; }
      .time { font-family:'Nimbus Roman No9 L','Times New Roman',serif; font-size:32px; font-weight:700; fill:#25231f; }
      .status { font-family:'Nimbus Sans',Arial,sans-serif; font-size:28px; font-weight:700; letter-spacing:.4px; fill:#25231f; }
    ]]></style>
  </defs>

  <rect class="paper" width="1700" height="2200"/>
  <line x1="140" y1="105" x2="1560" y2="105" class="rule"/>
  <rect x="140" y="91" width="12" height="12" fill="#6e2f29"/>
  <text class="title" x="140" y="188">H1 — THE MITRE SQUARE CHRONOLOGY</text>
  <line x1="140" y1="225" x2="1560" y2="225" class="heavy-rule"/>

  <!-- Ledger frame. -->
  <rect x="140" y="300" width="1420" height="1680" fill="#f8f2e7" stroke="#34352d" stroke-width="5"/>
  <rect x="140" y="300" width="1420" height="110" fill="#414536"/>
  <line x1="520" y1="300" x2="520" y2="1980" class="rule"/>
  <text class="head" x="170" y="370">TIME</text>
  <text class="head" x="555" y="370">ESTABLISHED EVENT</text>

  <!-- Row fills and rules. -->
  <rect x="140" y="590" width="1420" height="170" fill="#eee7d8"/>
  <rect x="140" y="1050" width="1420" height="140" fill="#eee7d8"/>
  <rect x="140" y="1475" width="1420" height="220" fill="#e8e0cf"/>
  <rect x="140" y="1695" width="1420" height="285" fill="#f8f2e7"/>
  <g class="rule">
    <line x1="140" y1="410" x2="1560" y2="410"/>
    <line x1="140" y1="590" x2="1560" y2="590"/>
    <line x1="140" y1="760" x2="1560" y2="760"/>
    <line x1="140" y1="1050" x2="1560" y2="1050"/>
    <line x1="140" y1="1190" x2="1560" y2="1190"/>
    <line x1="140" y1="1475" x2="1560" y2="1475"/>
    <line x1="140" y1="1695" x2="1560" y2="1695"/>
  </g>
  <line x1="140" y1="1475" x2="1560" y2="1475" class="heavy-rule"/>

  <!-- Times / status. -->
  <text class="time" x="170" y="510">About 1:00 a.m.</text>
  <text class="time" x="170" y="685">1:30 a.m.</text>
  <text class="time" x="170" y="915">About 1:35 a.m.</text>
  <text class="time" x="170" y="1134">1:44 a.m.</text>
  <text class="time" x="170" y="1340">About 2:55 a.m.</text>
  <text class="status" x="170" y="1595">Established</text>
  <text class="status" x="170" y="1845">Not established</text>

  <!-- Exact approved event copy. Line breaks are typographic only. -->
  <text class="body" x="555" y="485">
    <tspan x="555" dy="0">Catherine Eddowes is released from Bishopsgate Police</tspan>
    <tspan x="555" dy="48">Station.</tspan>
  </text>
  <text class="body" x="555" y="655">
    <tspan x="555" dy="0">PC Edward Watkins passes through Mitre Square; no</tspan>
    <tspan x="555" dy="48">body is present.</tspan>
  </text>
  <text class="body" x="555" y="825">
    <tspan x="555" dy="0">Joseph Lawende and his companions see a man with a</tspan>
    <tspan x="555" dy="48">woman believed, from her clothing, to have been Eddowes</tspan>
    <tspan x="555" dy="48">near Church Passage. Lawende doubts he could recognize</tspan>
    <tspan x="555" dy="48">the man again.</tspan>
  </text>
  <text class="body" x="555" y="1134">Watkins discovers Eddowes’s body.</text>
  <text class="body" x="555" y="1255">
    <tspan x="555" dy="0">PC Alfred Long finds a piece of Eddowes’s apron in</tspan>
    <tspan x="555" dy="48">Goulston Street. He says it was not there when he</tspan>
    <tspan x="555" dy="48">passed at about 2:20.</tspan>
  </text>
  <text class="body" x="555" y="1545">
    <tspan x="555" dy="0">The outer murder window is 1:30–1:44. The apron piece</tspan>
    <tspan x="555" dy="48">was later elsewhere.</tspan>
  </text>
  <text class="body" x="555" y="1760">
    <tspan x="555" dy="0">Exact murder minute; offender’s route; who carried the</tspan>
    <tspan x="555" dy="48">cloth; exact deposit time; authorship of the graffito.</tspan>
  </text>
</svg>
