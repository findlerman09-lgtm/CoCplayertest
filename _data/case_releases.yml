# Player-facing case-release registry.
#
# Keep unreleased person names, image paths, clue text, and other spoiler-bearing
# content OUT of plaintext fields in this public repository. True content for the
# active releases below lives only inside the encrypted lock payload.
#
# Supported kinds: person, portrait, photograph, location, evidence, scene.
# The release password gates only the web artifact. It must never gate a core clue.
items:
  - id: filed-location-01
    kind: location
    listed: true
    case_file: current-file
    status: sealed
    safe_label: "Location record"
    safe_title: "Filed Location"
    safe_summary: "A sealed location card may be opened when the Keeper releases it."
    lock:
      id: "wij-reward-01"
      iterations: 100000
      salt: "ymMrpjcT2QU2J//gJc5wcg=="
      iv: "fCjNQY/z4ZgJQtZc"
