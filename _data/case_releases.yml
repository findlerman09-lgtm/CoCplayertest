# True release content lives only inside the encrypted lock payload.
# source_lock records are hidden until their already-issued source artifact has been opened locally.
# ledger:true records count toward the Archive case-desk progress strip; companion records do not.
# The release password gates only the web artifact. It must never gate a core clue.
