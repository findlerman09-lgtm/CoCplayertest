occupation_display: Surveyor of Risks
occupation_full: Fire-insurance surveyor
residence: Clerkenwell
social_status: Self-made respectable commercial professional
summary: Arthur Bell is a quiet, dry, observant fire-insurance surveyor whose work has made him thoroughly familiar with the practical life of commercial premises.
roleplay_anchor: Before deciding what happened, find what had to move.
human_detail: Bell counts stairs in unfamiliar buildings.
background: 'Bell is a self-made commercial professional whose authority was earned rather than inherited. His earlier working
  life gave him practical familiarity with warehouses, cartage, loads, horses, packing, and the ordinary physical compromises
  of commercial work. He now surveys risk for fire insurance: premises, access, construction, storage, working arrangements,
  and the ways in which a respectable written account may differ from what is physically happening on the floor. He knows
  how to speak to proprietors without pretending to be one and how to speak to working men without pretending he never left
  manual work behind.'
history: Bell's present standing was hard won. Years of physical work taught him that a problem described neatly in an office
  often looks different beside the actual load, wall, stable, doorway, or damaged structure. That rise also made him protective
  of professional discretion. His reputation is useful precisely because people believe he will distinguish an observed condition
  from an accusation he cannot support.
player_edges:
- label: Competence spotlight
  title: The Physical Story
  text: 'You are unusually good at reading physical arrangement: what moved, what bears weight, what is worn, what route is
    practical, what access was required, and whether a proposed sequence fits the space.'
- label: Unique access
  title: Insured Premises
  text: Your profession gives you legitimate reasons to approach certain commercial properties, proprietors, foremen, tradesmen,
    and records when an insurance interest actually exists. It does not give you a right to inspect unrelated premises.
- label: Professional pressure
  title: Hard-Won Standing
  text: Your reputation for practical judgment and discretion can make respectable commercial people take you seriously. The
    same reputation gives you something to lose if you behave recklessly or make claims you cannot defend.
knowledge:
- title: Movement Has Constraints
  text: Weight changes posture and pace. Awkward property changes the route people choose. Service entrances and yards often
    tell a different story from front doors.
- title: Commercial London Is Physical
  text: You know the ordinary ecology of carts, packing, warehouses, stable arrangements, water, labor, estimates, invoices,
    storage, and imperfect books.
- title: A Mechanism Before a Miracle
  text: When something mechanical appears impossible, your first assumption is that you have missed the mechanism—not that
    ordinary rules have ceased to apply.
