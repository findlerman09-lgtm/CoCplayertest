summary: Arthur Bell is a quiet, dry, observant fire-insurance surveyor whose work has made him thoroughly familiar with the practical life of commercial premises.
roleplay_anchor: Before deciding what happened, find what had to move.
human_detail: Bell's manner is quiet, dry, and observant. He is more likely to test a practical assumption than to make a dramatic declaration.
background: >-
  Arthur Bell is a quiet, dry, observant fire-insurance surveyor whose work has made him thoroughly familiar with the practical life of commercial premises. Warehouses, yards, carts, horses, packing, storage, loads, access routes, and the ordinary movement of goods are not abstractions to him. Bell prefers to establish what a physical problem actually required before deciding which explanation sounds most convincing. His skepticism is curious rather than dismissive: when something makes no ordinary sense, his first assumption is that there is a mechanism he has not yet understood.
history: >-
  His professional history includes a warehouse fire in Wapping.
player_edges:
- label: Competence spotlight
  title: Loads & Movement
  text: >-
    You are particularly good at noticing small physical discrepancies and reasoning about weight, packing, storage, carts, horses, access, and what moving people or goods through a space would actually require.
- label: Unique access
  title: Commercial Premises
  text: >-
    Your legitimate work gives you ordinary professional familiarity with warehouses, yards, cartage, storage, fire risk, and damage inspection. It does not give you universal inspection authority or the rights of police.
knowledge:
- title: Movement Has Constraints
  text: Weight changes posture and pace. Awkward property changes the route people choose. Service entrances and yards often tell a different story from front doors.
- title: Commercial London Is Physical
  text: You know the ordinary ecology of carts, packing, warehouses, stable arrangements, water, labor, estimates, invoices, storage, and imperfect books.
- title: A Mechanism Before a Miracle
  text: When something mechanical appears impossible, your first assumption is that you have missed the mechanism—not that ordinary rules have ceased to apply.
