- Ordinary personal and professional effects appropriate to the current assignment.
- No firearm is routinely carried.
owned_available:
- Ordinary surveying, measuring, drawing, and professional work materials appropriate to his occupation may exist at his home
  or office. They are not automatically assumed to be on his person.
professional_access:
- Insured or prospective insured premises when his office has a real business reason.
- Property owners, managers, foremen, warehouse workers, carmen, stable workers, and tradesmen in the course of that work.
- Relevant commercial records voluntarily supplied or properly available through an insurance assignment.
- Colleagues and ordinary trade contacts.
requires_permission:
- A genuine insurance interest, invitation, consent, employer instruction, client relationship, or another lawful reason to
  inspect private property or its books.
access_limits:
- Cannot demand entry to an unrelated business.
- Cannot seize ledgers or correspondence.
- Cannot conduct a universal commercial audit.
- Cannot identify a person’s occupation merely from a generic packing practice.
- Cannot turn Mechanical Repair into comprehension of an impossible mechanism.
