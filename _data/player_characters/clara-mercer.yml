investigator_id: SS
publication_name: Clara Mercer
name_status: development_hold
age: 32
occupation_display: Reporter — East-End district
occupation_full: Reporter, fictional London newspaper — East-End district
residence: Modest rented rooms in Clerkenwell
social_status: Lower-middle-class professional with working-class family origins; respectable but financially insecure
summary: You investigate how information moves—who actually saw something, who repeated it, who altered it, and what will
  happen if it reaches print.
roleplay_anchor: Who heard it first?
human_detail: Every notebook page has a narrow source margin. If you cannot identify where a claim came from, that margin
  remains blank.
background: You are a working woman in London journalism with a hard-news district assignment that is unusual enough to have
  been earned rather than taken for granted. Your family origins are working-class. Your father worked as a compositor and
  now has failing eyesight, so the physical labor of making a newspaper has never been invisible to you. You know that a newspaper
  is not one mind. Reporters, runners, compositors, editors, owners, sellers, deadlines, corrections, and rivals all affect
  what eventually becomes “what everybody knows.”
history: 'Your career taught you that the most dramatic version of a story is often the version that has traveled furthest
  from its source. It also taught you something harder: information is not harmless merely because it is true. Publication
  can change a witness, a police inquiry, a source''s safety, a suspect''s behavior, a household''s reputation, or what the
  next witness believes they remember.'
player_edges:
- label: Competence spotlight
  title: Follow It Back
  text: 'When a claim is circulating through several people, you may investigate its provenance: who contributed it, who merely
    repeated it, and where the story changed.'
- label: Unique access
  title: A Source Is a Relationship
  text: 'Your access comes through favors, restraint, corrections, payment, mutual usefulness, and trust. Sources remain people:
    they may refuse, bargain, conceal, misunderstand, or lie.'
- label: Personal responsibility
  title: Before the Ink Dries
  text: You understand that publication is an action with consequences. Choosing what to publish, hold, correct, attribute,
    or protect can materially change later human behavior.
knowledge:
- title: The Newspaper Is a System
  text: You understand London newspaper work and deadlines; runners, compositors, street sellers, offices, archives, and rival
    reporting.
- title: Follow the Claim Back
  text: You know how to trace a quotation or rumor through human sources and how public records and advertisements can reveal
    commercial footprints.
- title: Mobility Is Part of the Work
  text: You know how to follow somebody in public without looking like a police pursuit.
- title: Corrections Travel Slowly
  text: A correction usually travels less quickly than the original claim. You do not possess a perfect source network.
people:
- name: George Mercer
  relationship: Father; former compositor
  text: His failing eyesight keeps the physical labor and economics of newspaper work close to home. The reporter contributes
    modestly to his expenses.
relationships:
- name: Arthur Bell
  relationship: Warehouse-fire acquaintance
  text: You know each other from a warehouse fire in Wapping. You respect his technical precision. He thinks you can be reckless
    with adjectives; you think he sometimes hides behind what he is professionally permitted to say.
- name: Miriam Hart
  relationship: Professional recognition and tension
  text: You recognize one another through prior local/professional contact. She knows you are capable of restraint and therefore
    expects you to exercise it deliberately.
- name: Thomas Merrick
  relationship: Professional counterpart
  text: You know City detectives as professional counterparts and obstacles, not as private contacts.
- name: Dr Laurence Kersey
  relationship: No private relationship
  text: No intimate prior relationship is assumed.
known_pressure: A reporter must produce something. Deadlines, competition, editor expectations, money, credibility, and source
  relationships mean that waiting for perfect certainty can cost a story—but publishing before understanding what a story
  will do can cost far more.
