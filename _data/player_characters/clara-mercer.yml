investigator_id: SS
publication_name: Clara Mercer
name_status: development_hold
age: 32
occupation_display: Reporter — East-End district
occupation_full: Reporter, fictional London newspaper — East-End district
residence: Modest rented rooms in Clerkenwell
social_status: Lower-middle-class professional with working-class family origins; respectable but financially insecure
summary: You investigate how information moves—who actually saw something, who repeated it, who altered it, and what will happen if it reaches print.
roleplay_anchor: Who heard it first?
human_detail: Clara leaves a narrow source margin down every notebook page. Initials go there. When she cannot identify where a statement came from, the margin remains blank.
background: >-
  Clara Mercer is the daughter of a London compositor and learned early that newspapers are made by ordinary people working against deadlines. She entered journalism through short local items, descriptive reporting, interviews, and subjects considered suitable for a woman writer. In a newsroom where routine district and crime reporting was ordinarily men's work, her harder East-End assignments were unusual and hard-won. She earned them by verifying names, tracing accounts to their sources, correcting mistakes, and returning with usable copy.
history: >-
  Clara once covered a warehouse fire in Wapping that Arthur Bell inspected professionally. The public explanation omitted problems Bell could not freely discuss. Bell corrected one technical error in Clara's understanding; Clara checked rather than defending her copy and published a correction. She did not print the larger allegation she could not substantiate. The lesson stayed with her: know which sentence is yours, which belongs to a source, and which nobody has actually proved.
player_edges:
- label: Competence spotlight
  title: Follow It Back
  text: >-
    You are unusually good at tracing circulating stories back to the people who actually contributed information, distinguishing independent reports from repeated rumor.
- label: Unique access
  title: A Source Is a Relationship
  text: >-
    Particular people speak to you because of previous favors, restraint, corrections, payment, or trust. Sources can refuse, lie, bargain, protect others, or withdraw.
- label: Personal responsibility
  title: Before the Ink Dries
  text: >-
    You understand that publication changes later testimony, police pressure, suspect behavior, household safety, and public belief. Filing copy is an action with consequences.
knowledge:
- title: Three Voices May Still Be One Source
  text: Repetition produces confidence faster than evidence. Establish who actually saw or heard the event before counting witnesses.
- title: A Name in Print Changes the Next Interview
  text: Once a public version circulates, later witnesses may repeat what they learned after the event.
- title: A Question Is Not a Warrant
  text: Journalism opens different doors from policing but grants no right to seize records, compel answers, search premises, or demand evidence.
people:
- name: George Mercer
  relationship: Father
  text: A former compositor with failing eyesight. Clara contributes modestly to his expenses. He respects newspapers without believing type makes a statement true.
relationships:
- name: Arthur Bell
  relationship: Prior professional contact
  text: Mutual technical respect and professional suspicion dating from a warehouse fire in Wapping.
- name: Miriam Hart
  relationship: Recognition / professional tension
  text: Clara once quoted Miriam's useful comment without naming her. Their first substantive exchange occurs during the current investigation.
- name: Thomas Merrick
  relationship: Professional counterpart
  text: You know City detectives as professional counterparts and obstacles, not as private contacts.
- name: Dr Laurence Kersey
  relationship: No private relationship
  text: No intimate prior relationship is assumed.
known_pressure: A reporter must produce something. Deadlines, competition, editor expectations, money, credibility, and source relationships mean that waiting for perfect certainty can cost a story—but publishing before understanding what a story will do can cost far more.
