carried:
- Reporter’s notebook with a dedicated source margin.
- Ordinary writing materials.
- No firearm or automatic camera is assumed.
owned_available:
- Ordinary personal and journalistic materials available through home or work. Newspaper resources belong to the newspaper, not automatically to the investigator.
professional_access:
- The newspaper office and appropriate internal files.
- Reporters, runners, compositors, sellers, and other press workers.
- Public commercial information and advertisements.
- Cultivated sources.
- Public houses, courts, street scenes, businesses, and public places where a reporter may legitimately ask questions.
requires_permission:
- Private business books, police evidence, confidential documents, restricted premises, an editor’s agreement, a source’s anonymity, unusual expenses, or use of newspaper resources all depend on the actual circumstances.
access_limits:
- Cannot demand police evidence.
- Cannot inspect private books by right.
- Cannot guarantee that an editor will print—or suppress—copy.
- Cannot guarantee source anonymity.
- Cannot treat Fast Talk as coercion.
- Cannot materialize a relevant source whenever convenient.
- Cannot assume a camera or firearm is present.
