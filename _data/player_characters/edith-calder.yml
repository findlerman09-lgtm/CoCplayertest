carried:
- Reporter’s notebook, pencils and shorthand materials.
- Ordinary purse, keys and personal effects.
- No routine firearm or camera.
owned_available:
- Personal notes from Edith’s own work, not Clara’s case file.
- Public newspaper copies and court reports available by ordinary purchase or access.
- Usual writing materials and inexpensive professional supplies.
professional_access:
- Public hearings, filing counters and court precincts where attendance is permitted.
- Press rooms and news exchanges by customary access or invitation.
- Relevant reporters, runners, clerks and printers who actually know Edith.
- Public streets, shops and businesses where she may ask questions.
requires_permission:
- Private employer papers, locked premises and restricted legal documents.
- Access to police records, witnesses under control and medical notes.
- Use of another newspaper's staff, telegraph credit or confidential records.
access_limits:
- No police authority, search power or right to private business books.
- No automatic access to Clara Mercer's possessions, notes, sources or character progress.
- No guaranteed source, truthful answer, editor or favorable publication.
- No magic, supernatural abilities, special weapons or impossible technology.
editorial_holds:
- Details of the earlier real Clara/Edith conversation belong to the table record and are not retrospectively authored.
