investigator_id: REPLACEMENT_SS_01
publication_name: Edith Calder
name_status: issued_replacement
age: 31
occupation_display: Freelance Court and District Reporter
occupation_full: Independent court and district reporter in London; no fixed newspaper affiliation
residence: Modest rented rooms within reach of London's courts and eastern districts
social_status: Independent, financially precarious working professional
summary: You seek the firsthand observation beneath the polished report, even when the truth embarrasses your own profession.
roleplay_anchor: Who saw it, before anyone wrote it?
human_detail: Edith numbers every interview in her notebook. When a story is repeated by someone who was not there, she marks the account with a small question mark.
background: >-
  Edith Calder built a precarious freelance career on court reports, interviews and district dispatches. Without a salaried newsroom to protect her, she makes her living by reaching witnesses first, taking accurate shorthand, and checking a promising story against records before selling her copy. Her directness has won grudging respect and cost her assignments.
history: >-
  Edith was a professional rival of Clara Mercer. They pursued some of the same East-End stories, competed for access and copy, and actually interacted earlier during the current Ripper investigation. The substance and tone of that encounter are whatever happened at the table; no earlier words or discoveries are invented here. Clara's death has made the rivalry painfully permanent, but it does not make Edith an inheritor of Clara's private evidence or possessions.
player_edges:
- label: Competence spotlight
  title: The Verbatim Difference
  text: Edith can take exact shorthand and compare what a person said with later claims about their words. This skill can expose reporting errors and changed accounts, not magically reveal lies.
- label: Unique access
  title: The Court Steps
  text: Court corridors, newspaper exchanges, runners and working clerks give Edith plausible ways to seek public records or request an introduction. No person is obliged to cooperate.
- label: Personal responsibility
  title: A Competitor's Debt
  text: Edith must decide whether to tell an honest account of Clara's final work even when the facts threaten Edith's reputation or contradict what she wrote before.
knowledge:
- title: Evidence Before Headlines
  text: A newspaper story does not become independent corroboration simply because several papers repeat it.
- title: Shorthand Is Not Omniscience
  text: Accurate notes preserve what was spoken, not whether the speaker was truthful.
- title: A Reporter Has No Warrant
  text: Professional confidence does not confer police authority or access to private records.
people:
- name: Clara Mercer
  relationship: Deceased professional rival
  text: Edith competed with Clara for stories and spoke with her during this adventure. Remember the actual encounter; Edith has no claim to Clara's notes or private materials.
- name: Court and newspaper workers
  relationship: Working contacts
  text: Individual clerks, compositors, messengers and sellers may recognize Edith's work. Their help depends on specific relationships, permissions and circumstances.
relationships:
- name: Arthur Bell
  relationship: Another investigator
  text: Bell's work with physical systems complements Edith's ability to establish who first reported a claim; no personal acquaintance is assumed.
- name: Thomas Merrick
  relationship: Police counterpart
  text: Merrick can give a defensible account of procedure; Edith cannot commandeer his evidence or his authority.
- name: Miriam Hart
  relationship: Fellow investigator
  text: Miriam's care for household accounts can challenge Edith's habit of turning people's experiences into copy.
- name: Dr Laurence Kersey
  relationship: Fellow investigator
  text: Medical testimony needs careful attribution. Edith does not claim private access to his case notes.
known_pressure: >-
  Clara is dead; the story continues. Edith has to decide when an account is worth printing and when the people affected deserve her silence. Freelance income, professional rivalry and the need to be trusted all pull in different directions.
