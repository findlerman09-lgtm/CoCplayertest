carried:
- Ordinary personal and school-related effects appropriate to her circumstances.
- No routine weapon.
owned_available:
- Ordinary household and teaching materials at home or school. School property is not automatically Miriam’s personal inventory.
professional_access:
- Pupils and families she actually knows.
- School staff and records appropriate to her duties.
- Particular households with whom she has an established relationship.
- Bounded educational, relief, or referral contacts.
- People who know from experience that she follows through.
requires_permission:
- Confidential school information, another institution’s records, unfamiliar households, private rooms, and another person’s secrets require a genuine relationship, consent, duty, or appropriate institutional route.
access_limits:
- Cannot speak for an entire community.
- Cannot convert Jewish identity into universal access.
- Cannot expose school or household confidences casually.
- Cannot compel a family to speak because she is a teacher.
- Cannot treat every East-End address as personally familiar.
- Cannot use high social skills as automatic consent.
editorial_holds:
- Exact school.
- Relief/referral contact identity and title.
- Minor equipment terminology.
