investigator_id: DL
publication_name: Miriam Hart
name_status: locked
age: 32
occupation_display: Certificated Assistant Mistress, School Board for London
occupation_full: School Board for London
residence: Modest rooms in East London, shared with her widowed mother
social_status: Lower-middle class; educated, respectable, salaried, financially constrained
summary: You understand that names, addresses, records, and official summaries only become truthful when connected back to the actual people whose lives they describe.
roleplay_anchor: Tell me whose name it is first.
human_detail: Miriam dates even personal notes in the upper-right corner. Her mother says this is because Miriam cannot otherwise remember when anything happened.
background: >-
  Miriam Hart is a London-born Jewish woman who grew up in a household where education meant respectable work and a measure of independence. She entered the pupil-teacher system young, qualified, and became a certificated assistant mistress under the School Board for London, working in the girls' department of an East London board school. School has taught her that the facts of a household rarely fit cleanly into one line of a register. A child may live with an aunt for a week, a lodger may receive letters at a workplace, and yesterday's correct address may be wrong tonight. Miriam is good at records because she knows when a record has stopped being the same thing as the truth.
history: >-
  Two years ago pupil Annie Feld disappeared from school after her family left its registered rooms. Miriam remembered that Annie's mother had previously mentioned a married sister during a relief referral. Rather than treating that private knowledge as school property, Miriam asked that the address be rechecked through the proper channels. Annie was found safe in temporary rooms and returned to school. The incident left Miriam with three habits: an address has a date, a record has a purpose, and knowing something about a household does not mean she owns the information.
player_edges:
- label: Competence spotlight
  title: Household Truth
  text: >-
    You are exceptionally good at distinguishing legal names from familiar ones, permanent residence from temporary lodging, family from lodgers, work addresses from homes, and old records from current facts.
- label: Unique access
  title: Reciprocal Trust
  text: >-
    Particular parents, former pupils, neighbors, and relief contacts know that you keep confidences and follow through. That can make conversations possible that would close in front of strangers. Trust never guarantees disclosure.
- label: Personal pressure
  title: If You Take the Name
  text: >-
    When you say you will find somebody, carry a message, or come back with an answer, people tend to believe you. Accepting responsibility therefore has human consequences.
knowledge:
- title: An Address Has a Date
  text: People move, lodge temporarily, use work addresses, and stay with family. Ask when an address was true and what purpose it served.
- title: A Closed Door Is Information Too
  text: A person who once trusted you may refuse to speak now. That refusal is not proof of guilt, but it means the relationship or circumstances have changed.
- title: Institutions Become Answerable Through Particulars
  text: A precise name, date, address, decision-maker, and contradictory note can be more effective than an argument about institutions in the abstract.
people:
- name: Rebecca Hart
  relationship: Mother
  text: Rebecca is practical, affectionate, and keenly aware of the cost of Miriam taking responsibility for everyone else's troubles.
- name: Sarah Feld
  relationship: Parent of a former pupil
  text: Sarah trusts Miriam because Miriam once helped without turning the household's difficulties into public information. That trust includes Sarah's right to refuse her.
relationships:
- name: Dr Laurence Kersey
  relationship: Trusted professional referral
  text: A previous household medical concern established reciprocal respect. Miriam supplies precise household context without surrendering confidence; Kersey treats the person as a patient, separates observation from inference, and does not treat referral as permission to interrogate.
- name: Clara Mercer
  relationship: Recognition / professional tension
  text: Clara once quoted a useful comment from Miriam without naming her. Miriam knows the reporter exercised restraint, but also knows that even an accurate quotation can change what happens to a household once it enters print.
- name: Thomas Merrick
  relationship: Indirect recognition
  text: You may know his name indirectly through professional contacts, but no friendship is assumed.
- name: Arthur Bell
  relationship: No prior relationship
  text: You have not met before the campaign begins.
known_pressure: Trust Is Borrowed. Other people find Miriam useful. That usefulness can become an obligation from every direction—school, household, relief work, officials, neighbors—and she has limited time, money, and institutional power with which to satisfy those demands.
