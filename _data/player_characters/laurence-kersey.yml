occupation_display: Registered Medical Practitioner
occupation_full: Registered Medical Practitioner
residence: East London
social_status: Respectable middle-class professional; established and financially viable, but dependent on his practice
qualifications: M.R.C.S. Eng.; L.S.A. Lond.
training: London Hospital Medical College
summary: You treat the living patient first and solve difficult problems by reconstructing what changed, in what order, and which explanation actually fits.
roleplay_anchor: What changed first?
human_detail: When an account becomes confused, Kersey uses coins, matches, corks, or folded scraps to represent people and events, physically rearranging them until the sequence can be tested.
background: >-
  Laurence Kersey is a London-born general medical practitioner, the son of chemist and druggist Alfred Kersey. He grew up around practical medicine before training at London Hospital Medical College and qualifying M.R.C.S. Eng.; L.S.A. Lond. He now combines paying general practice with bounded charitable dispensary duties in East London. Kersey solves problems by putting events back into causal order, refuses to call uncertainty knowledge, and is willing to use his own hands when somebody needs saving.
history: >-
  Before the Cart Moved. Kersey once treated a carman injured beside an overturned cart. Reconstructing the accounts showed that the man's collapse preceded the cart accident rather than simply resulting from it. The case taught Kersey that a collection of true facts can still produce a false explanation when they are placed in the wrong order. His lasting lesson: “An explanation can contain every true fact and still put them in the wrong order.”
player_edges:
- label: Analytical competence
  title: Reconstruct the Chain
  text: >-
    Reassemble symptoms, physical states, movements, and observations into testable causal sequences. This exposes assumptions but never invents missing facts.
- label: Living-patient access
  title: The Patient Is Still Here
  text: >-
    You can obtain useful information from injured, frightened, exhausted, or distressed people while recognizing their medical limits and preserving their status as patients rather than treating them merely as evidence.
- label: Practical action
  title: Use What You Have
  text: >-
    Adapt ordinary available materials to immediate medical and rescue problems without creating impossible treatments, technology, or supernatural solutions.
knowledge:
- title: Symptoms Have an Order
  text: Establish what changed first and what followed before assigning cause.
- title: A Wound Can Exclude More Than It Identifies
  text: Medical evidence may rule out or weaken explanations without identifying an offender's profession, weapon, or identity automatically.
- title: Stabilize Before You Explain
  text: When someone is still endangered, determine the immediate threat to the living person before solving the theory.
people:
- name: Alfred Kersey
  relationship: Father
  text: A chemist and druggist easing toward retirement. Practical, experienced, and affectionate; a grounding influence rather than an unlimited pharmaceutical resource.
- name: Samuel Harcourt
  relationship: Older medical colleague
  text: Harcourt respects Kersey's care but believes professional responsibility sometimes requires a usable answer before perfect certainty is available.
relationships:
- name: Miriam Hart
  relationship: Established referral trust
  text: A previous household medical concern established reciprocal respect; Miriam supplies precise household context without surrendering confidence, and Kersey separates observation from inference and does not treat referral as permission to interrogate.
- name: Thomas Merrick
  relationship: Professional respect and disagreement
  text: A previous assault investigation taught both men the difference between questioning a living patient quickly and questioning them usefully.
- name: Arthur Bell
  relationship: No substantial prior relationship
  text: No substantial prior relationship is required.
- name: Clara Mercer
  relationship: No private relationship
  text: No private access or automatic trust is assumed merely because she is a reporter.
known_pressure: A Doctor Is Expected to Have an Answer. People want certainty from Kersey because he is a doctor. His pressure is not whether to act; he is willing to act quickly when action is justified. The pressure is whether he can resist turning “this is the best explanation available” into “this is what certainly happened.”
