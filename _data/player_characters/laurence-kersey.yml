carried:
- Ordinary personal and professional medical effects appropriate to current duty.
- No firearm.
owned_available:
- Ordinary medical books, supplies, and professional materials associated with his practice may be available at the appropriate location. They are not an endlessly portable laboratory.
professional_access:
- His own patients.
- Households with which he has an actual medical relationship.
- Physicians, apothecaries, and other medical workers through ordinary professional channels.
- Medical information entrusted to him appropriately.
- Living patients who consent to treatment and examination.
requires_permission:
- Another doctor’s patient, private medical notes, institutional records, a hospital room, a corpse, a post-mortem report, police exhibits, or another practitioner’s cooperation require the proper professional, legal, or personal route.
access_limits:
- Cannot commandeer an official post-mortem.
- Cannot demand another doctor’s confidential material.
- Cannot turn Medicine 80 into exact modern time-of-death science.
- Cannot identify an exotic mechanism solely from an injury.
- Cannot use a portable laboratory that does not exist.
- Cannot diagnose the supernatural.
editorial_holds:
- Exact practice address.
- Exact dispensary/institution.
- Minor medical-equipment terminology.
- Samuel Harcourt's exact institutional affiliation remains held.
