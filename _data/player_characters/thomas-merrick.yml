publication_name: Thomas Merrick
name_status: locked
age: 38
occupation_display: Detective Constable, City of London Police
occupation_full: City of London Police Detective Department, Old Jewry
residence: Clerkenwell
social_status: Respectable working-to-lower-middle-class police professional
summary: You reconstruct what people actually did, in what order, and what the evidence really entitles authority to do next.
roleplay_anchor: First what happened. Then what it means. Then what we are entitled to do about it.
human_detail: Merrick saves used envelopes and writes household lists on their blank backs. He dislikes wasting good paper.
background: >-
  Thomas Merrick was raised in a household where a written account mattered. His father kept books for a small City tradesman, and Thomas learned early that names, deliveries, sums, and promises became much harder to dispute once somebody had written them down properly. He entered police work young and learned its less romantic habits: finding addresses, taking statements, noticing who came and went, and hearing the same event described very differently by several honest people. Detective work suited him. Merrick likes routes, times, motives, account books, lodging records, employment histories, and the ordinary facts from which a recent human sequence can be reconstructed. He believes procedure is useful because responsibility can be located within it: somebody asks, signs, requests authority, and decides when there are grounds to act.
history: >-
  Three years ago Merrick investigated the theft of valuable goods from a City warehouse. A night watchman confidently identified a recently dismissed tally clerk as the man he had seen leaving the premises. The motive appeared obvious and the timing seemed plausible. Merrick pressed the suspect hard and initially treated the watchman's certainty as stronger evidence than it deserved. A delivery record, a cabman's recollection, and a reconstruction of the route eventually established that the clerk could not reasonably have been where the witness believed he had seen him. Merrick corrected the investigation before a charge was carried through, but not before the man spent a night under suspicion and lost work. Merrick did not become afraid to act. He became exact about the difference between suspicion, grounds for inquiry, grounds for detention, and proof.
player_edges:
- label: Competence spotlight
  title: The Human Sequence
  text: You are exceptionally good at taking scattered statements, motives, routes, times, and records and turning them into a sequence that can actually be tested. A confident story matters less than one whose parts agree.
- label: Unique access
  title: City Police Standing
  text: Within a City investigation you can act with legitimate police standing, review appropriate official material, make proper requests, question people, preserve evidence, and call upon City colleagues within their duties. Beyond City jurisdiction, cooperation must be obtained rather than assumed.
- label: Personal pressure
  title: A Defensible Decision
  text: You have made a premature conclusion before and remember who paid for it. You are willing to act before everything is known, but you distinguish suspicion, grounds for inquiry, grounds for detention, and proof. Serious decisions may later require serious explanations.
knowledge:
- title: Witnesses Can Be Honest and Wrong
  text: Frightened witnesses can be truthful and inaccurate at once, and fear of police is not proof of guilt.
- title: Sources Are Not Automatically Independent
  text: Two witnesses repeating the same story are not automatically two independent sources.
- title: Precision Can Be False
  text: A precise time may rest on an imprecise clock; a confident statement still has to survive routes, records, and opportunity.
- title: London Has Jurisdictions
  text: Cooperation between police forces is possible without turning them into one organization.
people:
- name: Margaret Merrick
  relationship: Wife
  text: Margaret is a stationer's daughter and can make more sense of Thomas's handwriting than anyone alive. Their marriage is affectionate and practical, though police work has never shown much respect for supper, Sundays, or promises made before a bell rings at Old Jewry. She expects Thomas to notice when the work has begun consuming everything around it.
- name: Detective Inspector James McWilliam
  relationship: Senior City detective
  text: McWilliam is a demanding senior officer who values useful work more than theatrical certainty. Approval from above does not make an unsupported conclusion stronger.
relationships:
- name: Dr Laurence Kersey
  relationship: Professional respect and disagreement
  text: A previous assault investigation taught both men the difference between questioning a living patient quickly and questioning them usefully. Merrick respects Kersey's refusal to turn a plausible medical inference into a fact merely because the investigation would prefer an answer.
- name: Arthur Bell
  relationship: Professional familiarity
  text: You know the kind of professional he is more readily than the man himself.
- name: Miriam Hart
  relationship: Indirect recognition
  text: At most, a name encountered indirectly through shared professional contacts.
- name: Clara Mercer
  relationship: Professional presence
  text: You know reporters as a professional presence. There is no pre-existing private alliance.
known_pressure: A Defensible Decision. You must make defensible decisions under incomplete information. Your superiors, fellow officers, courts, witnesses, and household can all be affected by what you decide. Past experience has made you unwilling to confuse a strong suspicion with a right you have not earned.
