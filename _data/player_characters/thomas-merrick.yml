carried:
- Ordinary personal and police-duty effects appropriate to his current assignment.
- No firearm is routinely carried.
owned_available:
- Ordinary personal possessions and police-duty resources that remain at home or the police office rather than magically accompanying
  him everywhere.
professional_access:
- Approach City officers and superiors as a colleague.
- Conduct and preserve witness interviews.
- Consult or request appropriate police records.
- Make formal civilian or commercial inquiries.
- Identify himself credibly as a City detective.
- Request cooperation from Metropolitan colleagues.
requires_permission:
- Private premises, private books, Metropolitan resources, medical confidences, evidence outside his assignment, and coercive
  police steps require the actual authority or cooperation appropriate to the situation.
access_limits:
- Cannot command Metropolitan Police merely because he is a detective.
- Cannot seize private books on suspicion alone.
- Cannot treat companions as deputies.
- Cannot disclose police material freely.
- Cannot use Psychology as a lie detector.
- Cannot use Handgun 20 as evidence that a revolver is available.
editorial_holds:
- Minor police-duty equipment terminology.
- Period-appropriate police identification/credential wording.
