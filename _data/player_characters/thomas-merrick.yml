investigator_id: DK
publication_name: Thomas Merrick
name_status: locked
age: 38
occupation_display: Detective Constable
occupation_full: City of London Police Detective Department, Old Jewry
residence: Clerkenwell
social_status: Respectable working-to-lower-middle-class police professional
summary: You reconstruct what people actually did, in what order, and what the evidence really entitles authority to do next.
roleplay_anchor: First what happened. Then what it means. Then what we are entitled to do about it.
human_detail: Merrick saves used envelopes for household lists.
background: 'Merrick is a sworn City of London Police detective constable. He knows the streets, offices, courts, statements,
  reports, delays, and ordinary compromises of investigative work. His authority is genuine, but London is not one police
  jurisdiction. His office is not a universal warrant, and he has learned that a man can damage an investigation by pretending
  jurisdictional inconvenience does not exist. His strongest habit is reconstructive: statements, motives, routes, times,
  records, opportunity, and the next thing a person would probably need to do.'
history: Earlier in Merrick's career, a plausible case narrowed around a recently dismissed tally clerk. A confident witness
  identification and a persuasive motive encouraged Merrick to put too much weight on certainty too early. Delivery and route
  evidence eventually disproved the accusation. The correction mattered, but it came after harm had already been done. Merrick
  has never forgotten the distinction between suspicion, inquiry, detention, and proof. He is not timid because of that failure.
  He is disciplined.
player_edges:
- label: Competence spotlight
  title: The Human Sequence
  text: You are exceptionally good at taking scattered statements, motives, routes, times, and records and turning them into a sequence that can actually be tested. A confident story matters less than one whose parts agree.
- label: Unique access
  title: City Police Standing
  text: Within a City investigation you can act with legitimate police standing, review appropriate official material, make proper requests, question people, preserve evidence, and call upon City colleagues within their duties. Beyond City jurisdiction, cooperation must be obtained rather than assumed.
- label: Personal pressure
  title: A Defensible Decision
  text: You have made a premature conclusion before and remember who paid for it. You are willing to act before everything is known, but you distinguish suspicion, grounds for inquiry, grounds for detention, and proof. Serious decisions may later require serious explanations.
knowledge:
- title: Witnesses Can Be Honest and Wrong
  text: Frightened witnesses can be truthful and inaccurate at once, and fear of police is not proof of guilt.
- title: Sources Are Not Automatically Independent
  text: Two witnesses repeating the same story are not automatically two independent sources.
- title: Precision Can Be False
  text: A precise time may rest on an imprecise clock; a confident statement still has to survive routes, records, and opportunity.
- title: London Has Jurisdictions
  text: Cooperation between police forces is possible without turning them into one organization.
people:
- name: Margaret Merrick
  relationship: Wife
  text: Your police work exists inside a household, not outside ordinary life. Night duty, reputation, injury, and institutional
    trouble have consequences at home.
- name: Detective Inspector James McWilliam
  relationship: Senior City officer
  text: A real professional relationship, not a patron who grants unrestricted freedom. His confidence matters because Merrick's
    office and responsibilities matter.
relationships:
- name: Dr Laurence Kersey
  relationship: Professional respect and disagreement
  text: You know one another professionally. A previous case left each of you irritated by the other's refusal to overstate
    what the evidence proved—and convinced that the refusal was made in good faith.
- name: Arthur Bell
  relationship: Professional familiarity
  text: You know the kind of professional he is more readily than the man himself.
- name: Miriam Hart
  relationship: Indirect recognition
  text: At most, a name encountered indirectly through shared professional contacts.
- name: Clara Mercer
  relationship: Professional presence
  text: You know reporters as a professional presence. There is no pre-existing private alliance.
known_pressure: A Defensible Decision. You must make defensible decisions under incomplete information. Your superiors, fellow officers, courts,
  witnesses, and household can all be affected by what you decide. Past experience has made you unwilling to confuse a strong
  suspicion with a right you have not earned.
