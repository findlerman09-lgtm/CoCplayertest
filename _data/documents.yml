items:
  - id: handout-01-mitre-square-chronology
    title: The Mitre Square Chronology
    type: report
    type_label: Chronology
    section: reports
    channel: documents
    visibility: shared
    source: Current inquiry
    date: Sunday, 30 September 1888
    released: true
    status: open
    case_file: current-file
    summary: A concise chronology separating established times from what remains unknown.
    body: |
      **Sunday, 30 September 1888**

      **About 1:00 a.m.** — Catherine Eddowes released from Bishopsgate Police Station.

      **1:30 a.m.** — PC Edward Watkins passes through Mitre Square; no body is present.

      **About 1:35 a.m.** — Joseph Lawende and his companions see a man with a woman believed, from her clothing, to have been Eddowes near Church Passage. Lawende doubts he could recognize the man again.

      **1:44 a.m.** — Watkins discovers Eddowes's body.

      **About 2:55 a.m.** — PC Alfred Long finds a piece of Eddowes's apron in Goulston Street. He says it was not there when he passed at about 2:20.

      **Established:** the outer murder window is 1:30–1:44. The apron piece was later elsewhere.

      **Not established:** exact murder minute; offender's route; who carried the cloth; exact deposit time; authorship of the graffito.

  - id: handout-02-penfold-day-book
    title: Extract from Penfold's Day Book
    type: notebook
    type_label: Day-book Extract
    section: notes
    channel: documents
    visibility: shared
    source: Penfold & Co.
    date: August–October 1888
    released: false
    status: open
    case_file: current-file
    summary: Ordinary removal and storage entries surrounding the jobs under inquiry.
    body: |
      **2 Aug.** Mrs W. Prentice—Whitechapel Road to Stepney Green. Two rooms. Bedding & one chest to store. Van.

      **4 Aug.** R. L. Fenner—Aldgate to Bishopsgate. Office desk, chairs, four cases. Deliver same day.

      **7 Aug.** C. H. Merton, agent—western Whitechapel premises. Residual shop & office effects. Selected goods to store; refuse as directed. Balance awaiting instruction. V./N.—ask re rear room.

      **9 Aug.** Mrs T. Havers—Commercial Road to Mile End. Bedroom furniture & boxes. One van.

      **11 Aug.** S. Dunning—effects to warehouse. Wardrobe, bedstead, chairs, trunks. Lot 47.

      **27 Sept.** W. Canning for P. Griggs—Commercial Road premises. Remaining shop fittings & household effects. Part to store; trunks delivered.

      **29 Sept.** Mrs Ellery—Whitechapel Road rooms to St George's. Two-room removal. Upper floor. V./N.

      **1 Oct.** M. Sayer—two trunks & chest to store. Lot 52.

  - id: handout-03-merton-query
    title: Merton's Query
    type: letter
    type_label: Business Correspondence
    section: correspondence
    channel: documents
    visibility: shared
    source: C. H. Merton
    date: 1888
    released: false
    status: open
    case_file: current-file
    summary: A customer-side query about a small locked case or parcel from the August removal.
    body: |
      Sir,

      The former occupier has again asked whether a small locked case or parcel from the rear room was included among the miscellaneous effects removed on the 7th. I cannot identify it upon your account. Kindly ask the men whether it was placed with goods to store, treated as refuse, or left at the premises.

      Yours,

      C. H. Merton

      *In Samuel's pencil at the foot:*

      **Ask Vale / Naylor what came from rear.**

  - id: handout-04-canning-key-note
    title: Canning's Key Note
    type: letter
    type_label: Business Note
    section: correspondence
    channel: documents
    visibility: shared
    source: W. Canning
    date: 1888
    released: false
    status: open
    case_file: current-file
    summary: Instructions concerning return of the rear-yard key after a removal.
    body: |
      Mr Penfold,

      Please see that the rear-yard key is returned when the removal is finished. Cleaning men are expected Wednesday before the incoming tenant takes possession. The front key remains with me.

      W. Canning

  - id: handout-05-working-hypotheses
    title: Working Hypotheses
    type: notebook
    type_label: Investigation Worksheet
    section: notes
    channel: documents
    visibility: shared
    source: Investigator working paper
    date: Current inquiry
    released: true
    status: open
    case_file: current-file
    summary: A neutral worksheet for separating established facts from testable explanations.
    body: |
      **What is established?**

      **What might explain it?**

      **How could we test that explanation?**

      **What does it account for?**

      **What remains unexplained?**

      **What ordinary records would it create?**

      **Who would see it?**

      **What kind of access would it require?**

      **Where could we check it?**
