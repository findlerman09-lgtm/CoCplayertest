    status: open
    basis: development_only
    case_file: current-file
    summary: A longer non-canon summary tests wrapping in the archive shelf and the wider newspaper paper treatment when opened.
    body: |
      # DEMONSTRATION HEADING

      **NON-CANON LAYOUT SAMPLE.** This newspaper-style record exists solely to test typography, wrapping, open-record spacing, and the visual relationship between metadata and a wider paper object.

      Nothing in this text represents historical research or campaign content.

  - id: shared-demo-report
    title: DEMO — Formal Report
    type: report
    type_label: Formal Report
    section: reports
    channel: documents
    visibility: shared
    source: Demonstration records office
    date: Layout sample
    released: true
    status: open
    basis: development_only
    case_file: current-file
    summary: A neutral report-format sample used to test a denser page of prose inside the shared archive.
    body: |
      **NON-CANON DEMONSTRATION REPORT**

      **Purpose:** Validate the formal-report container at realistic reading length.

      **Observation:** Metadata should remain subordinate to the document itself. The paper should feel like one object within the archive rather than a separate web panel.

      **Disposition:** Remove or replace this demonstration record when scenario-authorized material becomes available.

