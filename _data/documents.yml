  - id: clara-demo-open-letter
    title: DEMO — Open Letter
    type: letter
    type_label: Letter
    section: correspondence
    channel: correspondence
    visibility: personal
    owner: clara-whitcombe
    owner_label: Clara Whitcombe
    source: Demonstration Sender
    date: Layout sample
    released: true
    status: open
    basis: development_only
    summary: Non-canon open correspondence used only to test how an ordinary letter sits beside a sealed item.
    body: |
      **NON-CANON DEMONSTRATION RECORD**

      Miss Whitcombe,

      This letter exists only to test the open-correspondence presentation. It intentionally contains no campaign clue, historical claim, or scenario information.

      The second paragraph is slightly longer so the layout can be judged when ordinary prose begins to wrap and the paper object needs more vertical room.

      — Demonstration Sender

